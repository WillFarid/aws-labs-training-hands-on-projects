openapi: 3.0.3
info:
  title: AWS Serverless User API
  version: 1.0.0
  description: Read-only API that returns user records stored in DynamoDB.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    variables:
      apiId: { default: abc123xyz }
      region: { default: us-east-1 }
      stage: { default: dev }
security:
  - ApiKeyAuth: []
paths:
  /users:
    get:
      summary: List users
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: nextToken
          in: query
          description: Opaque token from a previous response to fetch the next page.
          schema: { type: string }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
              example:
                users:
                  - { userId: example-1, name: Example User }
                count: 1
                hasMore: false
        "400":
          description: Invalid `limit` or `nextToken`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Missing or invalid API key.
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Throttled.
        "500":
          description: Server error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    UserPage:
      type: object
      required: [users, count, hasMore]
      properties:
        users:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              userId: { type: string }
        count: { type: integer }
        hasMore: { type: boolean }
        nextToken:
          type: string
          description: Present only when hasMore is true.
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
